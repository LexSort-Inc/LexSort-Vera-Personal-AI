[package]
name = "vera-engine"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
toml = "0.8"
lazy_static = "1.5"
num_cpus = "1.16"
sha2 = "0.10"
fs2 = "0.4"
sysinfo = "0.31"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
