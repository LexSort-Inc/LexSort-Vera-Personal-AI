[package]
name = "VERA"
version = "1.3.0"
description = "LexSort Personal AI — Private Local Chat"
authors = ["William Commu / Just Me Media"]
edition = "2021"
default-run = "VERA"

[lib]
name = "lexsort_personal_ai_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = [] }
tauri-plugin-shell  = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
url = "2"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
sysinfo        = "0.30"
reqwest        = { version = "0.12", features = ["stream", "rustls-tls", "json", "blocking"], default-features = false }
sha2           = "0.10"
tokio          = { version = "1", features = ["full"] }
futures-util   = "0.3"
axum           = { version = "0.7", features = ["ws", "multipart"] }
tower          = "0.4"
tower-http     = { version = "0.5", features = ["cors"] }
mdns-sd        = "0.11"
hostname       = "0.4"
local-ip-address = "0.6"
hex            = "0.4"
dirs           = "5.0"
chrono         = { version = "0.4", features = ["serde"] }
rusqlite       = { version = "0.31.0", features = ["bundled"] }
anyhow         = "1"
tracing        = "0.1"
git2           = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
uuid           = { version = "1", features = ["v4", "serde"] }
whoami         = "1"
thiserror      = "1"

[[bin]]
name = "vera-server"
path = "src/server.rs"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = ["ApplicationModel_Appointments", "Foundation"] }


