name: VeraGo
options:
  bundleIdPrefix: com.lexsort
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: C76T5D27A2
  SWIFT_VERSION: "5.10"
  TARGETED_DEVICE_FAMILY: "1"
  INFOPLIST_FILE: VeraGo/Info.plist

targets:
  VeraGo:
    type: application
    platform: iOS
    sources:
      - path: VeraGo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexsort.vera-go
        INFOPLIST_FILE: VeraGo/Info.plist
        CODE_SIGN_ENTITLEMENTS: VeraGo/VeraGo.entitlements
    info:
      path: VeraGo/Info.plist
    entitlements:
      path: VeraGo/VeraGo.entitlements
    dependencies: []
