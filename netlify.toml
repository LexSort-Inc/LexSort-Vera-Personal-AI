[build]
  publish = "website"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "scripts/"


[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."uptime-monitor"]
  schedule = "@hourly"

# Stripe webhook needs raw body for signature verification
[functions."stripe-webhook"]
  included_files = []

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Public marketing site — allow cross-origin reads so AI tools, crawlers,
    # and social previews (Open Graph) can access all pages.
    # frame-ancestors 'self' still prevents clickjacking while allowing previews.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://github.com https://api.github.com https://objects.githubusercontent.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    # cross-origin: public site must be fetchable by external services (AI tools, OG scrapers, etc.)
    Cross-Origin-Resource-Policy = "cross-origin"
    Access-Control-Allow-Origin = "*"


# Serve llms.txt as plain text for AI agents
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "index, follow"
    Cross-Origin-Resource-Policy = "cross-origin"
    Access-Control-Allow-Origin = "*"

# Serve sitemap.xml correctly
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Robots-Tag = "noindex"
    Cross-Origin-Resource-Policy = "cross-origin"
    Access-Control-Allow-Origin = "*"

# Serve robots.txt correctly
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cross-Origin-Resource-Policy = "cross-origin"
    Access-Control-Allow-Origin = "*"
