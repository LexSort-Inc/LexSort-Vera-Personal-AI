name: Build & Release VERA Freeware

on:
  # Tag-push auto-builds DISABLED Sep 2026 (internal-build policy — Mac/Win
  # built locally; a v* push used to auto-spend macOS/Linux CI minutes).
  # To re-enable, uncomment the push block below.
  # push:
  #   tags:
  #     - 'v*'
  # Manual trigger: lets you build one platform at a time to save CI minutes.
  # Windows is manual-only (~$8/run on GitHub paid minutes). Tag pushes auto-build macOS + Linux only.
  # Go to GitHub → Actions → "Build & Release VERA Freeware" → Run workflow
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform(s) to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows-only
          - macos-only
          - linux-only
      tag_name:
        description: 'Release tag to attach artifacts to (e.g. v1.1.7) — required for manual builds'
        required: false
        default: ''

# Serialize builds that target the same release. On a tag push the group is the
# tag ref; on a manual dispatch it is the tag_name input. A manual Windows
# dispatch submitted while a tag-push run is still in flight waits for it
# instead of racing to attach assets (tauri-apps/tauri-action#1270:
# parallel builds can hit a 404 on the releases API right after createRelease).
# cancel-in-progress: false so an already-running (paid) Windows build is never
# cancelled by a newer dispatch.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag_name }}
  cancel-in-progress: false

jobs:
  # ── Single owner of the GitHub release ──────────────────────────────────────
  # Creates (or finds) the release exactly once BEFORE any build job starts, and
  # hands the resulting release_id down to every platform job. Platform jobs
  # upload into that shared release instead of each racing to create the same
  # tag — the root cause of the v1.1.8 missing-assets failure. Ubuntu runner is
  # free and the step takes ~5s.
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: prepare release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::No release tag available (manual builds must pass tag_name)."
            exit 1
          fi

          VERSION="${TAG#v}"

          # Reuse the release if it already exists; otherwise create it once.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it."
          else
            gh release create "$TAG" \
              --title "LexSort VERA $VERSION — Personal AI" \
              --notes "See changelog and release notes."
          fi

          RELEASE_ID="$(gh release view "$TAG" --json id --jq '.id')"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Using release $TAG (id=$RELEASE_ID)."
  # ── macOS + Linux (auto on tag push, selectable via manual dispatch) ──
  build-macos-linux:
    permissions:
      contents: write
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'macos-only' || inputs.platform == 'linux-only'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''

    runs-on: ${{ matrix.platform }}
    needs: prepare-release

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install Rust target (macOS cross-compile only)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: install frontend dependencies
        run: npm ci
        working-directory: vera-freeware

      - name: Setup Apple signing (macOS only)
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain
          security set-keychain-settings -t 3600 -l build.keychain

      - name: build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.event_name == 'push' && 'v__VERSION__' || inputs.tag_name }}
          releaseName: 'LexSort VERA v__VERSION__ — Personal AI'
          releaseBody: 'See changelog and release notes.'
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          args: ${{ matrix.args }}
          projectPath: vera-freeware

  # ── Windows (manual dispatch only — ~$8/run on GitHub paid minutes) ──
  build-windows:
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'windows-only')
    runs-on: windows-latest
    needs: prepare-release

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Windows native build environment (better-sqlite3)
        shell: pwsh
        run: |
          echo "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: install frontend dependencies
        run: npm ci
        working-directory: vera-freeware

      - name: build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ inputs.tag_name }}
          releaseName: 'LexSort VERA v__VERSION__ — Personal AI'
          releaseBody: 'See changelog and release notes.'
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          args: ''
          projectPath: vera-freeware
