name: Contract Tests

on:
  # Push trigger DISABLED Sep 2026: ~75 pushes/2 days burned through the
  # org's monthly minutes. Run manually when a signal is needed.
  # To re-enable, uncomment the push block below.
  # push:
  #   branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Tauri/GTK/WebKit link chain)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Run contract tests
        env:
          # Sandbox: never touch a real ~/.lexsort even if a test forgets
          # its own override (test_dir_creation self-sandboxes too).
          LEXSORT_DIR_OVERRIDE: /tmp/lexsort-ci
        run: |
          cd vera-freeware/src-tauri
          # NOTE: --test contracts target never existed (failed every run).
          # Run the hermetic unit tests by name; Ollama/network-dependent
          # tests (e.g. test_list_models) are excluded by design — they
          # need a live backend CI doesn't have.
          cargo test -- test_version_compare test_dir_creation --nocapture
